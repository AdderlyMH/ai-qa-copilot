name: application-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: python -m pip install --disable-pip-version-check uv==0.11.16
      - run: uv sync --locked
      - run: npm ci
      - run: python scripts/tasks.py ci

  migration-check:
    name: migration-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
      - run: python -m pip install --disable-pip-version-check uv==0.11.16
      - run: uv sync --locked
      - run: python scripts/tasks.py db-check

  security-harness:
    name: security-harness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
      - run: python -m pip install --disable-pip-version-check uv==0.11.16
      - run: uv sync --locked
      - run: python scripts/tasks.py security-harness

  security-scans:
    name: security-scans
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: python -m pip install --disable-pip-version-check uv==0.11.16
      - run: uv sync --locked
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: uv tool run --from pip-audit==2.9.0 pip-audit --strict
      # Low-severity process-management advisories remain visible in Bandit output;
      # this blocking gate fails on medium and high severity findings.
      - run: uv tool run --from bandit==1.8.6 bandit --quiet --recursive apps/api/src scripts --severity-level medium
