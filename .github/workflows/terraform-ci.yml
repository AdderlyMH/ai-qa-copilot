name: terraform-ci

# Validation only: formatting, init without a backend, validate and an IaC
# policy scan. No cloud credentials, no OIDC, no plan and no apply. Do not add a paths filter: if this
# check is later required on pull requests, a skipped workflow would leave it in
# Expected.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-validate:
    name: terraform-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The wrapper is disabled so terraform output and exit codes pass through
      # unchanged; no later step reads the wrapper's step outputs.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Confirm the pinned Terraform version
        run: |
          terraform version
          test "$(terraform version | head -n 1)" = "Terraform v1.16.5"

      - name: Check formatting
        run: terraform fmt -check -recursive -diff infra

      - name: Require committed provider lock files
        run: |
          for root in infra/bootstrap infra/environments/production; do
            test -f "$root/.terraform.lock.hcl" || {
              echo "missing $root/.terraform.lock.hcl" >&2
              exit 1
            }
          done

      - name: Initialize without a backend
        run: |
          for root in infra/bootstrap infra/environments/production; do
            terraform -chdir="$root" init -backend=false -input=false
          done

      - name: Fail if init changed a lock file
        run: git diff --exit-code -- ':(glob)infra/**/.terraform.lock.hcl'

      - name: Validate
        run: |
          for root in infra/bootstrap infra/environments/production; do
            terraform -chdir="$root" validate
          done

      # IaC policy scan (THREAT_MODEL TM-DATA-007, SG-07). Checkov is pinned to an
      # exact PyPI release and installed with the repository's pinned uv, as
      # pip-audit and bandit are in application-ci. Without a platform API key
      # Checkov reports no severities, so the job fails on any failed check;
      # intentional exceptions are inline checkov:skip comments with reasons.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.16

      - name: Scan Terraform with Checkov
        run: >-
          uv tool run --python 3.12 --from checkov==3.3.20
          checkov --directory infra --framework terraform
          --compact --skip-download
