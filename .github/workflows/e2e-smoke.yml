name: e2e-smoke

# SKEL-007 Playwright smoke test. Not a required check: the owner decides
# acceptance. It uses the test-only API launcher (scripts/e2e_api.py) with
# SQLite and a fixed fake model, so it needs no secrets and makes no model calls.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: python -m pip install --disable-pip-version-check uv==0.11.16
      - run: uv sync --locked
      - run: npm ci
      - run: python scripts/tasks.py e2e
      # Same SHA as the evaluation workflows; the repository does not record
      # which release tag it is.
      - if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
