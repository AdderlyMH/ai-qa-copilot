name: Deploy owner app

# Builds the static owner app (apps/web) and deploys it to its own Cloudflare
# Pages project, in the owner-app Cloudflare account (ADR-022). It deploys the
# owner app only, never the guest demo, which stays a manual upload from another
# account.
#
# Requires the protected environment owner-app-deploy, created by the owner with
# its secrets, its variables and a required reviewer. See the runbook in
# docs/INFRASTRUCTURE.md, "Owner-app deployment runbook". The two Cloudflare
# secrets reach the deploy step only; the build holds public configuration only.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-owner-app
  cancel-in-progress: false

jobs:
  refuse-non-main:
    name: Refuse a run from another ref
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Explain why nothing was deployed
        run: echo "::notice::Nothing was deployed. This workflow deploys only from refs/heads/main; dispatch it from main."

  deploy:
    name: Build and deploy the owner app
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: owner-app-deploy

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # No dependency cache in a deploy: every run installs from the lockfile.
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Validate build variables
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_AUTH_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_AUTH_REDIRECT_URI }}
          NEXT_PUBLIC_AUTH_LOGOUT_URI: ${{ vars.NEXT_PUBLIC_AUTH_LOGOUT_URI }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          node - <<'JS'
          // The same rules as apps/web/next.config.ts, checked before the build.
          // Messages name the variable and never print its value.
          const env = process.env;

          function parsedHttps(value) {
            try {
              const url = new URL(value);
              return url.protocol === "https:" ? url : null;
            } catch {
              return null;
            }
          }

          const isHttpsOrigin = (value) => parsedHttps(value)?.origin === value;
          const isHttpsSiteRoot = (value) =>
            `${parsedHttps(value)?.origin}/` === value;

          const checks = [
            [
              "NEXT_PUBLIC_API_BASE_URL",
              (value) =>
                parsedHttps(value) !== null &&
                value.startsWith("https://") &&
                !value.endsWith("/"),
              "an https:// URL with no trailing slash",
            ],
            [
              "NEXT_PUBLIC_COGNITO_DOMAIN",
              isHttpsOrigin,
              "the https:// Cognito prefix-domain base URL with no path and no trailing slash",
            ],
            [
              "NEXT_PUBLIC_COGNITO_CLIENT_ID",
              (value) => value.trim() !== "",
              "non-empty",
            ],
            [
              "NEXT_PUBLIC_AUTH_REDIRECT_URI",
              isHttpsSiteRoot,
              "the https:// site root with a trailing slash",
            ],
            [
              "NEXT_PUBLIC_AUTH_LOGOUT_URI",
              isHttpsSiteRoot,
              "the https:// site root with a trailing slash",
            ],
            [
              "CLOUDFLARE_PAGES_PROJECT",
              (value) => /^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/.test(value),
              "a Pages project name: lowercase letters, digits and inner hyphens",
            ],
          ];

          let failed = false;
          for (const [name, isValid, rule] of checks) {
            if (!isValid(env[name] ?? "")) {
              console.log(`::error::${name} must be ${rule}.`);
              failed = true;
            }
          }
          process.exitCode = failed ? 1 : 0;
          JS

      # The postbuild hook of this npm script writes out/_headers, the CSP.
      - name: Build the static export
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_AUTH_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_AUTH_REDIRECT_URI }}
          NEXT_PUBLIC_AUTH_LOGOUT_URI: ${{ vars.NEXT_PUBLIC_AUTH_LOGOUT_URI }}
        run: npm run build --workspace @ai-qa-copilot/web

      - name: Check the build output
        run: |
          set -euo pipefail
          for file in apps/web/out/index.html apps/web/out/_headers; do
            [[ -f "$file" ]] || {
              echo "::error::$file was not produced by the build."
              exit 1
            }
          done
          if grep -qF "unsafe-inline" apps/web/out/_headers; then
            echo "::error::apps/web/out/_headers must not allow unsafe-inline."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: pages deploy apps/web/out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
