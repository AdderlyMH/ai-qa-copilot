name: Evaluation provider comparison

# Manual, budgeted evaluation of one model provider with one prompt baseline:
# b0 (the B0 prompt on the v2 corpus, ADR-014), informed (the informed
# single-call prompt on the v3 corpus, ADR-015) or informed-v4 (the same prompt
# on the objective-bearing v4 corpus, ADR-016). Results are provider-comparison
# evidence only and are never B1, B2 or gate evidence.
#
# Providers: anthropic (Claude C1/v1) runs every baseline. openai (gpt-6.1-sol,
# O1/v1) runs informed-v4 only: it has a spend-limited informed model and
# provenance support for that baseline alone. b0 and informed refuse openai.
# Each provider uses its own environment (c1-evaluation or openai-evaluation)
# and its own run step, and only that step receives that provider's key.

on:
  workflow_dispatch:
    inputs:
      model_provider:
        description: Model provider to evaluate (openai is accepted only with informed-v4).
        required: true
        type: choice
        default: anthropic
        options:
          - anthropic
          - openai
      baseline:
        description: Prompt baseline (b0 uses fixture v2; informed uses v3; informed-v4 uses v4).
        required: true
        type: choice
        default: b0
        options:
          - b0
          - informed
          - informed-v4
      scope:
        description: Case selection (validation and holdout are not available; probe is informed-v4 with openai only).
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - development
          - probe
      max_call_cost_usd:
        description: Per-call worst-case limit in USD (at most 0.09 for b0, 0.10 for informed, 0.11 for informed-v4).
        required: true
        type: string
        default: "0.09"
      max_run_cost_usd:
        description: Run spend limit in USD (hard maximum 6.00).
        required: true
        type: string
        default: "0.72"

permissions:
  contents: read

concurrency:
  group: evaluation-provider-comparison
  cancel-in-progress: false

jobs:
  evaluate:
    name: Run budgeted provider evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: ${{ inputs.model_provider == 'openai' && 'openai-evaluation' || 'c1-evaluation' }}

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version

      - name: Install locked Python tooling
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.16
          uv sync --frozen
          mkdir -p artifacts

      - name: Validate inputs and spend limits
        id: plan
        env:
          MODEL_PROVIDER: ${{ inputs.model_provider }}
          BASELINE: ${{ inputs.baseline }}
          SCOPE: ${{ inputs.scope }}
          MAX_CALL_COST_USD: ${{ inputs.max_call_cost_usd }}
          MAX_RUN_COST_USD: ${{ inputs.max_run_cost_usd }}
        run: |
          python - <<'PY'
          import os
          import re
          from decimal import Decimal

          HARD_MAX_RUN_COST_USD = Decimal("6.00")
          # Per-call limit by (baseline, provider): the per-case budget
          # (maximum_expected_cost) of that baseline's fixture. The validation
          # script runs without the fixture's YAML dependency, so the values are
          # held here; a test pins each one to its fixture. Update both together.
          PER_CALL_LIMIT_USD = {
              ("b0", "anthropic"): Decimal("0.09"),  # evaluation-cases.v2.yaml
              ("informed", "anthropic"): Decimal("0.10"),  # evaluation-cases.v3.yaml
              ("informed-v4", "anthropic"): Decimal("0.11"),  # evaluation-cases.v4.yaml
              ("informed-v4", "openai"): Decimal("0.11"),  # evaluation-cases.v4.yaml
          }
          # Declared budget per scope: selected cases x per-case budget (8 smoke,
          # 60 development; v4: 8 smoke, 31 development, 1 probe). A test pins
          # each value to its fixture.
          SCOPE_BUDGET_USD = {
              "b0": {"smoke": Decimal("0.72"), "development": Decimal("5.40")},
              "informed": {"smoke": Decimal("0.80"), "development": Decimal("6.00")},
              "informed-v4": {
                  "smoke": Decimal("0.88"),
                  "development": Decimal("3.41"),
                  "probe": Decimal("0.11"),
              },
          }
          # informed-v4 run limits may not exceed these (ADR-016). A probe runs
          # EVAL-111 once per dispatch; the two-call probe is two dispatches.
          INFORMED_V4_MAX_RUN_COST_USD = {
              "smoke": Decimal("0.88"),
              "development": Decimal("3.41"),
              "probe": Decimal("0.22"),
          }
          # The 8 smoke cases recorded in evaluation-v4-review.v1.yaml, and the
          # largest v4 prompt for the probe. A test pins both to the files.
          INFORMED_V4_CASE_IDS = {
              "smoke": (
                  "EVAL-105",
                  "EVAL-101",
                  "EVAL-106",
                  "EVAL-111",
                  "EVAL-112",
                  "EVAL-126",
                  "EVAL-120",
                  "EVAL-131",
              ),
              "development": (),
              "probe": ("EVAL-111",),
          }
          ARTIFACT_PREFIX = {"anthropic": "c1", "openai": "b0-openai"}
          INFORMED_ARTIFACT_PREFIX = {"anthropic": "informed-anthropic"}
          INFORMED_V4_ARTIFACT_PREFIX = {
              "anthropic": "informed-v4-anthropic",
              "openai": "informed-v4-openai",
          }
          USD_PATTERN = re.compile(r"^[0-9]+(\.[0-9]{1,6})?$")


          def fail(message: str) -> None:
              print(f"::error::{message}")
              raise SystemExit(1)


          provider = os.environ["MODEL_PROVIDER"]
          # The workflow always sets BASELINE from its input; only an absent
          # variable falls back to the input default. Empty or unknown is refused.
          baseline = os.environ.get("BASELINE", "b0")
          scope = os.environ["SCOPE"]
          if baseline not in SCOPE_BUDGET_USD:
              fail("baseline must be b0 or informed or informed-v4.")
          if provider not in ARTIFACT_PREFIX:
              fail("model_provider must be anthropic or openai.")
          if provider == "openai" and baseline != "informed-v4":
              fail(
                  f"OpenAI is not available for the {baseline} baseline: the only "
                  "OpenAI path is gpt-6.1-sol (O1/v1) on informed-v4 (ADR-016). "
                  "Use baseline informed-v4, or model_provider anthropic."
              )
          if scope not in SCOPE_BUDGET_USD[baseline]:
              fail("scope must be smoke or development (probe: informed-v4 with openai).")
          if scope == "probe" and provider != "openai":
              fail("scope probe is only available for informed-v4 with openai.")

          limits = {}
          for name in ("MAX_CALL_COST_USD", "MAX_RUN_COST_USD"):
              text = os.environ[name].strip()
              if not USD_PATTERN.fullmatch(text) or Decimal(text) <= 0:
                  fail(f"{name.lower()} must be a positive USD amount.")
              limits[name] = Decimal(text)

          if limits["MAX_RUN_COST_USD"] > HARD_MAX_RUN_COST_USD:
              fail(f"max_run_cost_usd exceeds the hard maximum {HARD_MAX_RUN_COST_USD}.")
          if limits["MAX_CALL_COST_USD"] > limits["MAX_RUN_COST_USD"]:
              fail("max_call_cost_usd cannot exceed max_run_cost_usd.")
          call_limit = PER_CALL_LIMIT_USD[(baseline, provider)]
          if limits["MAX_CALL_COST_USD"] > call_limit:
              fail(
                  f"max_call_cost_usd exceeds the {baseline} per-case budget "
                  f"{call_limit} USD."
              )
          scope_budget = SCOPE_BUDGET_USD[baseline][scope]
          if limits["MAX_RUN_COST_USD"] < scope_budget:
              fail(
                  f"max_run_cost_usd must cover the {scope} budget "
                  f"{scope_budget} USD."
              )
          if baseline == "informed-v4":
              run_cap = INFORMED_V4_MAX_RUN_COST_USD[scope]
              if limits["MAX_RUN_COST_USD"] > run_cap:
                  fail(
                      f"max_run_cost_usd exceeds the informed-v4 {scope} run limit "
                      f"{run_cap} USD."
                  )

          if baseline == "informed-v4":
              prefix = f"{INFORMED_V4_ARTIFACT_PREFIX[provider]}-{scope}"
          else:
              prefixes = ARTIFACT_PREFIX if baseline == "b0" else INFORMED_ARTIFACT_PREFIX
              prefix = f"{prefixes[provider]}-{scope}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"prefix={prefix}\n")
              output.write(f"scope_budget_usd={scope_budget}\n")
              if baseline == "informed-v4":
                  case_ids = " ".join(INFORMED_V4_CASE_IDS[scope])
                  output.write(f"case_ids={case_ids}\n")
          PY

      - name: Run evaluation
        if: inputs.model_provider == 'anthropic'
        env:
          ANTHROPIC_API_KEY: ${{ inputs.model_provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          BASELINE: ${{ inputs.baseline }}
          AI_QA_COPILOT_B0_MODEL_FACTORY: ai_qa_copilot_api.c1_evaluation_model:create_c1_b0_model
          AI_QA_COPILOT_C1_PRICING_PATH: fixtures/benchmark/pricing/anthropic-claude-sonnet-5-5.v1.yaml
          AI_QA_COPILOT_C1_MAX_CALL_COST_USD: ${{ inputs.max_call_cost_usd }}
          AI_QA_COPILOT_C1_MAX_RUN_COST_USD: ${{ inputs.max_run_cost_usd }}
          AI_QA_COPILOT_C1_CALL_LEDGER_PATH: artifacts/${{ steps.plan.outputs.prefix }}-ledger.jsonl
          AI_QA_COPILOT_INFORMED_MODEL_FACTORY: ai_qa_copilot_api.informed_claude_evaluation_model:create_informed_claude_model
          AI_QA_COPILOT_INFORMED_PRICING_PATH: fixtures/benchmark/pricing/anthropic-claude-sonnet-5-5.v1.yaml
          AI_QA_COPILOT_INFORMED_MAX_CALL_COST_USD: ${{ inputs.max_call_cost_usd }}
          AI_QA_COPILOT_INFORMED_MAX_RUN_COST_USD: ${{ inputs.max_run_cost_usd }}
          AI_QA_COPILOT_INFORMED_CALL_LEDGER_PATH: artifacts/${{ steps.plan.outputs.prefix }}-ledger.jsonl
          AI_QA_COPILOT_INFORMED_CONFIG_PATH: fixtures/benchmark/baselines/informed-single-prompt.v1.yaml
          AI_QA_COPILOT_INFORMED_REPOSITORY_ROOT: .
          SCOPE: ${{ inputs.scope }}
          PREFIX: ${{ steps.plan.outputs.prefix }}
          SCOPE_BUDGET_USD: ${{ steps.plan.outputs.scope_budget_usd }}
          CASE_IDS: ${{ steps.plan.outputs.case_ids }}
        run: |
          set -euo pipefail
          [[ -n "${ANTHROPIC_API_KEY:-}" ]] || {
            echo "::error::The ANTHROPIC_API_KEY secret is not configured in the c1-evaluation environment."
            exit 1
          }

          case "$BASELINE" in
            b0)
              run_arguments=(
                --fixture fixtures/benchmark/evaluation-cases.v2.yaml
                --executor ai_qa_copilot_api.naive_baseline:create_naive_baseline_executor
              )
              ;;
            informed)
              run_arguments=(
                --fixture fixtures/benchmark/evaluation-cases.v3.yaml
                --executor ai_qa_copilot_api.informed_baseline:create_informed_baseline_executor
              )
              ;;
            informed-v4)
              run_arguments=(
                --fixture fixtures/benchmark/evaluation-cases.v4.yaml
                --executor ai_qa_copilot_api.informed_baseline:create_informed_baseline_executor
              )
              ;;
            *)
              echo "::error::baseline must be b0 or informed or informed-v4."
              exit 1
              ;;
          esac

          if [[ "$BASELINE" == "informed-v4" ]]; then
            # Case IDs come from the validated plan; empty selects all 31 v4 cases.
            selection=(--split development)
            for case_id in $CASE_IDS; do
              selection+=(--case-id "$case_id")
            done
          elif [[ "$SCOPE" == "smoke" ]]; then
            selection=(
              --split development
              --case-id EVAL-001
              --case-id EVAL-013
              --case-id EVAL-025
              --case-id EVAL-034
              --case-id EVAL-043
              --case-id EVAL-049
              --case-id EVAL-055
              --case-id EVAL-058
            )
          else
            selection=(--split development)
          fi

          uv run python scripts/run_evaluation.py \
            "${run_arguments[@]}" \
            --repository-root . \
            --output "artifacts/${PREFIX}-run.json" \
            "${selection[@]}" \
            --max-expected-cost "$SCOPE_BUDGET_USD" \
            --max-concurrency 1

      - name: Run evaluation (OpenAI)
        if: inputs.model_provider == 'openai'
        env:
          OPENAI_API_KEY: ${{ inputs.model_provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          BASELINE: ${{ inputs.baseline }}
          AI_QA_COPILOT_INFORMED_MODEL_FACTORY: ai_qa_copilot_api.informed_openai_evaluation_model:create_informed_openai_model
          AI_QA_COPILOT_INFORMED_PRICING_PATH: fixtures/benchmark/pricing/openai-gpt-6-1-sol.v1.yaml
          AI_QA_COPILOT_INFORMED_MAX_CALL_COST_USD: ${{ inputs.max_call_cost_usd }}
          AI_QA_COPILOT_INFORMED_MAX_RUN_COST_USD: ${{ inputs.max_run_cost_usd }}
          AI_QA_COPILOT_INFORMED_CALL_LEDGER_PATH: artifacts/${{ steps.plan.outputs.prefix }}-ledger.jsonl
          AI_QA_COPILOT_INFORMED_CONFIG_PATH: fixtures/benchmark/baselines/informed-single-prompt.v1.yaml
          AI_QA_COPILOT_INFORMED_REPOSITORY_ROOT: .
          SCOPE: ${{ inputs.scope }}
          PREFIX: ${{ steps.plan.outputs.prefix }}
          SCOPE_BUDGET_USD: ${{ steps.plan.outputs.scope_budget_usd }}
          CASE_IDS: ${{ steps.plan.outputs.case_ids }}
        run: |
          set -euo pipefail
          [[ -n "${OPENAI_API_KEY:-}" ]] || {
            echo "::error::The OPENAI_API_KEY secret is not configured in the openai-evaluation environment."
            exit 1
          }
          if [[ "$BASELINE" != "informed-v4" ]]; then
            echo "::error::OpenAI runs are only available for baseline informed-v4."
            exit 1
          fi

          # Case IDs come from the validated plan; empty selects all 31 v4 cases.
          selection=(--split development)
          for case_id in $CASE_IDS; do
            selection+=(--case-id "$case_id")
          done

          uv run python scripts/run_evaluation.py \
            --fixture fixtures/benchmark/evaluation-cases.v4.yaml \
            --executor ai_qa_copilot_api.informed_baseline:create_informed_baseline_executor \
            --repository-root . \
            --output "artifacts/${PREFIX}-run.json" \
            "${selection[@]}" \
            --max-expected-cost "$SCOPE_BUDGET_USD" \
            --max-concurrency 1

      - name: Score run report
        env:
          BASELINE: ${{ inputs.baseline }}
          SCOPE: ${{ inputs.scope }}
          PREFIX: ${{ steps.plan.outputs.prefix }}
        run: |
          set -euo pipefail
          case "$BASELINE" in
            b0) fixture=fixtures/benchmark/evaluation-cases.v2.yaml ;;
            informed) fixture=fixtures/benchmark/evaluation-cases.v3.yaml ;;
            informed-v4) fixture=fixtures/benchmark/evaluation-cases.v4.yaml ;;
            *)
              echo "::error::baseline must be b0 or informed or informed-v4."
              exit 1
              ;;
          esac
          if [[ "$SCOPE" == "probe" ]]; then
            echo "Probe runs check the pipeline and cost only; they are not scored."
            exit 0
          fi
          uv run python scripts/score_evaluation_run.py \
            --fixture "$fixture" \
            --ground-truth fixtures/benchmark/ground-truth.v1.yaml \
            --run-report "artifacts/${PREFIX}-run.json" \
            --output "artifacts/${PREFIX}-score.json"

      - name: Record run provenance
        env:
          BASELINE: ${{ inputs.baseline }}
          MODEL_PROVIDER: ${{ inputs.model_provider }}
          PREFIX: ${{ steps.plan.outputs.prefix }}
          MAX_CALL_COST_USD: ${{ inputs.max_call_cost_usd }}
          MAX_RUN_COST_USD: ${{ inputs.max_run_cost_usd }}
        run: |
          set -euo pipefail
          ledger_arguments=()
          for ledger in artifacts/"${PREFIX}"-ledger*.jsonl; do
            ledger_arguments+=(--ledger "$ledger")
          done
          case "$BASELINE" in
            b0)
              uv run python scripts/record_evaluation_provenance.py \
                --run-report "artifacts/${PREFIX}-run.json" \
                "${ledger_arguments[@]}" \
                --pricing fixtures/benchmark/pricing/anthropic-claude-sonnet-5-5.v1.yaml \
                --fixture fixtures/benchmark/evaluation-cases.v2.yaml \
                --git-commit "$GITHUB_SHA" \
                --max-call-cost-usd "$MAX_CALL_COST_USD" \
                --max-run-cost-usd "$MAX_RUN_COST_USD" \
                --output "artifacts/${PREFIX}-provenance.json"
              ;;
            informed)
              uv run python scripts/record_informed_evaluation_provenance.py \
                --run-report "artifacts/${PREFIX}-run.json" \
                "${ledger_arguments[@]}" \
                --pricing fixtures/benchmark/pricing/anthropic-claude-sonnet-5-5.v1.yaml \
                --fixture fixtures/benchmark/evaluation-cases.v3.yaml \
                --informed-configuration fixtures/benchmark/baselines/informed-single-prompt.v1.yaml \
                --git-commit "$GITHUB_SHA" \
                --max-call-cost-usd "$MAX_CALL_COST_USD" \
                --max-run-cost-usd "$MAX_RUN_COST_USD" \
                --output "artifacts/${PREFIX}-provenance.json"
              ;;
            informed-v4)
              case "$MODEL_PROVIDER" in
                anthropic) pricing=fixtures/benchmark/pricing/anthropic-claude-sonnet-5-5.v1.yaml ;;
                openai) pricing=fixtures/benchmark/pricing/openai-gpt-6-1-sol.v1.yaml ;;
                *)
                  echo "::error::model_provider must be anthropic or openai."
                  exit 1
                  ;;
              esac
              uv run python scripts/record_informed_evaluation_provenance.py \
                --run-report "artifacts/${PREFIX}-run.json" \
                "${ledger_arguments[@]}" \
                --pricing "$pricing" \
                --fixture fixtures/benchmark/evaluation-cases.v4.yaml \
                --informed-configuration fixtures/benchmark/baselines/informed-single-prompt.v1.yaml \
                --provider "$MODEL_PROVIDER" \
                --git-commit "$GITHUB_SHA" \
                --max-call-cost-usd "$MAX_CALL_COST_USD" \
                --max-run-cost-usd "$MAX_RUN_COST_USD" \
                --output "artifacts/${PREFIX}-provenance.json"
              ;;
            *)
              echo "::error::baseline must be b0 or informed or informed-v4."
              exit 1
              ;;
          esac

      - name: Report score result without gating
        if: always()
        env:
          BASELINE: ${{ inputs.baseline }}
          SCOPE: ${{ inputs.scope }}
          PREFIX: ${{ steps.plan.outputs.prefix }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          # informed-v4 reports only the four discriminating checks (ADR-016),
          # each as passed of applicable. On the negative controls the expected
          # IDs and references are empty, so those two checks do not apply.
          DISCRIMINATING_CHECKS = (
              ("required_ground_truth_ids", "Required IDs"),
              ("unexpected_ground_truth_ids", "No unexpected IDs"),
              ("expected_source_references", "Source references"),
              ("policy_boundary", "Boundary"),
          )
          NOT_APPLICABLE_ON_CONTROLS = {
              "required_ground_truth_ids",
              "expected_source_references",
          }
          INFORMED_V4_NEGATIVE_CONTROLS = {"EVAL-128", "EVAL-129", "EVAL-130", "EVAL-131"}

          baseline = os.environ.get("BASELINE", "")
          scope = os.environ.get("SCOPE", "")
          prefix = os.environ.get("PREFIX", "")
          score_path = Path(f"artifacts/{prefix}-score.json")
          provenance_path = Path(f"artifacts/{prefix}-provenance.json")
          lines = [f"## Provider evaluation `{prefix or 'not started'}`", ""]
          if baseline == "informed-v4" and scope == "probe":
              lines.append("- Probe run: pipeline and cost check only; no score is reported")
          elif baseline == "informed-v4" and score_path.is_file():
              scores = json.loads(score_path.read_text(encoding="utf-8"))["scores"]
              lines.append("- Discriminating checks (passed of applicable; reported, not gated):")
              for code, label in DISCRIMINATING_CHECKS:
                  applicable = [
                      check["passed"]
                      for score in scores
                      for check in score["checks"]
                      if check["code"] == code
                      and not (
                          code in NOT_APPLICABLE_ON_CONTROLS
                          and score["case_id"] in INFORMED_V4_NEGATIVE_CONTROLS
                      )
                  ]
                  lines.append(f"  - {label}: {sum(applicable)} of {len(applicable)}")
              lines.append(
                  "- Development split, design-set results, "
                  "results_not_independently_validated; not B1, B2 or gate evidence"
              )
          elif score_path.is_file():
              passed = json.loads(score_path.read_text(encoding="utf-8")).get("passed")
              lines.append(f"- Score report passed: `{passed}` (reported, not gated)")
          else:
              lines.append("- Score report: not produced")
          if provenance_path.is_file():
              provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
              lines.append(f"- Calls: {provenance['ledger_call_count']}")
              lines.append(
                  f"- Charged: {provenance['ledger_charged_microusd'] / 1_000_000:.6f} USD"
              )
              if "max_calibration_ratio" in provenance:
                  lines.append(
                      f"- Max calibration ratio: {provenance['max_calibration_ratio']}"
                  )
              lines.append(f"- B1 evidence: `{provenance['b1_evidence']}`")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ${{ steps.plan.outputs.prefix || 'provider-evaluation-rejected' }}-${{ github.sha }}
          path: |
            artifacts/${{ steps.plan.outputs.prefix }}-run.json
            artifacts/${{ steps.plan.outputs.prefix }}-score.json
            artifacts/${{ steps.plan.outputs.prefix }}-provenance.json
            artifacts/${{ steps.plan.outputs.prefix }}-ledger*.jsonl
          if-no-files-found: warn
