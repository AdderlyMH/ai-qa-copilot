version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    # Protected evaluation workflows are pinned by tests and are changed only by
    # reviewed PRs, never by Dependabot (see docs/REPOSITORY_GOVERNANCE.md).
    exclude-paths:
      - .github/workflows/evaluation-smoke.yml
      - .github/workflows/evaluation-release.yml
      - .github/workflows/evaluation-provider-comparison.yml
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: terraform
    directory: /infra/bootstrap
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: terraform
    directory: /infra/environments/production
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
