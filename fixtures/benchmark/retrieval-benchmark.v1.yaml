schema_version: retrieval-benchmark/v1
benchmark_id: RAG-005-DEVELOPMENT-BASELINE-V1
classification: synthetic_public_only
purpose: >
  Visible development baseline for exact-source hybrid retrieval ranking. It is
  not a protected holdout, a full 100-case release evaluation, or evidence of a
  live embedding provider.
retrieval_configuration:
  retrieval_version: hybrid-v1
  fusion_method: reciprocal-rank-fusion-v1
  embedding_model: fixture-embedding-v1
  embedding_version: fixture-embedding-v1
  chunking_version: chunking-v1
cases:
